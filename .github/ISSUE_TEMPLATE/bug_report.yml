name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't paste prompts, transcripts or file contents that may be sensitive.** For security issues, use private vulnerability reporting instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: pitwall
    attributes:
      label: Pitwall version
      description: Pitwall → About Pitwall
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "`log show --last 10m --predicate 'subsystem == \"<bundle id>\"'`. Pitwall never logs prompts or paths."
      render: shell
