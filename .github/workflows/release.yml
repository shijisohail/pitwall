name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

      - name: Test
        run: swift test

      - name: Detect signing credentials
        id: creds
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import the Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize, staple
        if: steps.creds.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          PITWALL_REPO_URL: ${{ vars.PITWALL_REPO_URL }}
          BUILD_NUMBER: ${{ github.run_number }}      # monotonic; a shallow clone can't count commits
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          Scripts/release.sh
          rm -f "$NOTARY_KEY_PATH"

      - name: Build unsigned DMG (no signing credentials configured)
        if: steps.creds.outputs.signed != 'true'
        env:
          UNSIGNED: "1"
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          PITWALL_REPO_URL: ${{ vars.PITWALL_REPO_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/release.sh

      - name: Compose release notes
        env:
          SIGNED: ${{ steps.creds.outputs.signed }}
        run: |
          {
            echo "## Install"
            echo
            echo "Download **Pitwall-${GITHUB_REF_NAME#v}.dmg**, open it, and drag **Pitwall** to Applications. You also need [Claude Code](https://docs.claude.com/en/docs/claude-code/setup) installed and signed in."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "This build is signed with a Developer ID certificate and notarized by Apple."
            else
              echo "> **Unsigned build.** This DMG is ad-hoc signed and **not notarized**, so macOS will block it the first time. To approve it: open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to Pitwall (or run \`xattr -dr com.apple.quarantine /Applications/Pitwall.app\`). Verify the download against the attached \`.sha256\` file."
            fi
            echo
            echo "---"
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true
