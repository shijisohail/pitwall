<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Pitwall: the pit wall for your Claude Code sessions">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="0.9" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <radialGradient id="glowG" cx="88%" cy="0%" r="60%"><stop offset="0" stop-color="#9fef00" stop-opacity="0.16"/><stop offset="1" stop-color="#9fef00" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="4%" cy="100%" r="55%"><stop offset="0" stop-color="#5cb2ff" stop-opacity="0.12"/><stop offset="1" stop-color="#5cb2ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="340" rx="22" fill="#090c11"/>
  <rect width="1280" height="340" rx="22" fill="url(#glowG)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glowB)"/>
  <rect width="1280" height="340" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#293345"/>

  <text x="72" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="86" font-weight="800" fill="#9fef00" letter-spacing="4">PITWALL</text>
  <rect x="72" y="176" width="64" height="5" rx="2" fill="#9fef00"/>
  <text x="72" y="228" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#e6ebf5">The pit wall for your Claude Code sessions.</text>
  <text x="72" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#7d8aa5">native macOS  ·  many sessions at once  ·  approvals in one click</text>

  <!-- the board, as a sketch -->
  <g transform="translate(790 52)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700">
    <g>
      <text x="0" y="14" fill="#9fef00" letter-spacing="1.2">WORKING</text>
      <rect x="0" y="26" width="140" height="92" rx="9" fill="#11161e" stroke="#293345"/>
      <rect x="12" y="40" width="70" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.85"/>
      <rect x="12" y="58" width="116" height="26" rx="5" fill="#000" fill-opacity="0.35"/>
      <rect x="12" y="96" width="116" height="5" rx="2.5" fill="#293345"/><rect x="12" y="96" width="74" height="5" rx="2.5" fill="#9fef00"/>
      <rect x="0" y="130" width="140" height="70" rx="9" fill="#11161e" stroke="#293345"/>
      <rect x="12" y="144" width="86" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.85"/>
      <rect x="12" y="176" width="116" height="5" rx="2.5" fill="#293345"/><rect x="12" y="176" width="30" height="5" rx="2.5" fill="#9fef00"/>
    </g>
    <g transform="translate(160 0)">
      <text x="0" y="14" fill="#ffaf00" letter-spacing="1.2">NEEDS YOU</text>
      <rect x="0" y="26" width="140" height="120" rx="9" fill="#ffaf00" fill-opacity="0.07" stroke="#ffaf00" stroke-opacity="0.6"/>
      <rect x="12" y="40" width="80" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.85"/>
      <rect x="12" y="58" width="116" height="24" rx="5" fill="#000" fill-opacity="0.35"/>
      <rect x="12" y="96" width="44" height="26" rx="6" fill="#9fef00"/><rect x="62" y="96" width="30" height="26" rx="6" fill="#171d27" stroke="#293345"/><rect x="98" y="96" width="30" height="26" rx="6" fill="#171d27" stroke="#ff4d4d" stroke-opacity="0.6"/>
      <rect x="0" y="158" width="140" height="42" rx="9" fill="#ffaf00" fill-opacity="0.07" stroke="#ffaf00" stroke-opacity="0.6"/>
      <rect x="12" y="172" width="70" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.85"/>
    </g>
    <g transform="translate(320 0)">
      <text x="0" y="14" fill="#7d8aa5" letter-spacing="1.2">DONE TODAY</text>
      <rect x="0" y="26" width="140" height="52" rx="9" fill="#11161e" stroke="#293345"/><rect x="12" y="40" width="90" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.6"/><rect x="12" y="56" width="60" height="6" rx="3" fill="#9fef00" fill-opacity="0.8"/>
      <rect x="0" y="90" width="140" height="52" rx="9" fill="#11161e" stroke="#293345"/><rect x="12" y="104" width="76" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.6"/><rect x="12" y="120" width="52" height="6" rx="3" fill="#9fef00" fill-opacity="0.8"/>
      <rect x="0" y="154" width="140" height="46" rx="9" fill="#11161e" stroke="#293345"/><rect x="12" y="168" width="96" height="8" rx="3" fill="#e6ebf5" fill-opacity="0.6"/>
    </g>
  </g>
</svg>
