name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Needs Xcode with the macOS 26 SDK. Adjust the label if your account names it differently.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build (SwiftPM)
        run: swift build
      - name: Test
        run: swift test
      - name: Package the app (universal, hardened runtime, ad-hoc signed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/build.sh
      - name: Check the bundle
        run: |
          plutil -lint build/Pitwall.app/Contents/Info.plist
          lipo -archs build/Pitwall.app/Contents/MacOS/Pitwall
          codesign --verify --strict --verbose=2 build/Pitwall.app
          codesign -dv build/Pitwall.app 2>&1 | grep -q runtime
      - name: Zip the app
        run: ditto -c -k --keepParent build/Pitwall.app Pitwall-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pitwall-ci
          path: Pitwall-ci.zip
          retention-days: 7

  shell-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck Scripts/*.sh
